name: Verify RWX sample
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Python unit tests
        run: python -m unittest discover -s tests_local -v
      - name: Official public sample scoring
        run: |
          RWX_DATA="$PWD/sample" python selector.py > output.jsonl
          python score.py sample sample/answers.json output.jsonl
